[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GameHorizon-Annotator"
version = "0.1.0"
description = "GameHorizon-Annotator: automated multi-horizon (Level 1-3) gameplay instruction annotation pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["gameplay", "annotation", "video", "multimodal", "instruction", "benchmark"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://gamehorizon-suite.github.io"
Repository = "https://github.com/TencentARC/GameHorizon"
Paper = "https://arxiv.org/abs/2609.25001"
dependencies = [
  "av>=15",
  "httpx>=0.27",
  "openai>=1.0",
  "Pillow>=9.4",
]

[project.optional-dependencies]
scenedetect = [
  "scenedetect>=0.6",
  "opencv-python>=4.8",
]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.8",
]

[tool.uv]
package = true
required-version = ">=0.13,<0.14"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
annotator = [
  "game_profiles/*.json",
  "game_assets/*.md",
  "game_assets/public_manifest.json",
  "game_assets/*/*.py",
  "game_assets/*/*.json",
]

[tool.ruff]
target-version = "py310"
line-length = 100
include = [
  "src/annotator/core/**/*.py",
  "src/annotator/cli/**/*.py",
  "tests/**/*.py",
]
extend-exclude = ["src/annotator/game_assets/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
